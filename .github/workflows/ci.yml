name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PyYAML, which workspace.sh requires
        run: python3 -c 'import yaml' || pip install pyyaml
      # Globbed rather than listed, so a new script's or action's selftest runs
      # here the moment it lands instead of when someone remembers to add it.
      # The glob covers comment-lint's selftest, which used to be named here.
      - run: |
          found=0
          for t in scripts/*-selftest.sh actions/*/*-selftest.sh; do
            [ -f "$t" ] || continue
            found=$((found + 1))
            echo "== $t =="
            "$t"
          done
          [ "$found" -gt 0 ] || { echo "::error::no selftests found — the glob is wrong" >&2; exit 1; }
          echo "ran $found selftest(s)"

  no-personal-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dogfooded by local path, so a break in the action fails this repo's own
      # build before a consumer pinned at @v1 ever sees it.
      - uses: ./actions/no-personal-paths

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning scripts/*.sh actions/*/*.sh

  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/comment-lint

  bar-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # report-only until this repo has run a few waves under it, per the
      # graduated adoption comment-lint established.
      - uses: ./actions/bar-check
        with:
          report-only: "true"

  no-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No breaking-change marker may reach main
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          policy() {
            printf 'no-major: %s carries a breaking-change marker.\n\n' "$1" >&2
            printf '%s\n' \
              'Every repo here is capped below its next major until the owner' \
              'lifts the cap (see WO-060). release-please reads a "!" after the' \
              'type or scope, and a BREAKING-CHANGE footer, as a major bump, so' \
              'neither may reach main. Use a plain feat: or fix: and describe' \
              'the incompatibility in the commit body as prose.' >&2
            exit 1
          }
          has_marker() {
            local msg=$1 subject=${1%%$'\n'*}
            if grep -qE '^[A-Za-z]+(\([^)]*\))?!:' <<<"$subject"; then return 0; fi
            if grep -qE '^BREAKING[ -]CHANGE:' <<<"$msg"; then return 0; fi
            return 1
          }
          if [ -n "${PR_TITLE:-}" ]; then
            if has_marker "$PR_TITLE"; then policy 'the pull request title'; fi
            for sha in $(git log --format=%H "$BASE_SHA..$HEAD_SHA"); do
              if has_marker "$(git log -1 --format=%B "$sha")"; then
                policy "commit $sha"
              fi
            done
          else
            if has_marker "$(git log -1 --format=%B "$PUSH_SHA")"; then
              policy "commit $PUSH_SHA"
            fi
          fi
          echo 'no-major: ok'
