name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./actions/comment-lint/comment-lint-selftest.sh
      - run: |
          for t in scripts/*-selftest.sh; do
            echo "== $t =="
            "$t"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning scripts/*.sh actions/*/*.sh

  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/comment-lint
