name: comment-lint
description: Fail a build when comments run longer than the project's comment rule allows.
author: Mike Garrett

inputs:
  max-header:
    description: Maximum comment lines in a file header, which documents usage and flags.
    required: false
    default: "80"
  max-block:
    description: Maximum lines in any comment run below the header.
    required: false
    default: "4"
  path:
    description: File or directory to check. Defaults to every file git tracks in the caller's checkout.
    required: false
    default: ""
  report-only:
    description: Report violations without failing the build. Use while a repo still has a backlog.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_MAX_HEADER: ${{ inputs.max-header }}
        INPUT_MAX_BLOCK: ${{ inputs.max-block }}
        INPUT_REPORT_ONLY: ${{ inputs.report-only }}
      run: |
        set -uo pipefail
        args=(--max-header "$INPUT_MAX_HEADER" --max-block "$INPUT_MAX_BLOCK")
        [ -n "$INPUT_PATH" ] && args+=("$INPUT_PATH")
        if python3 "${{ github.action_path }}/comment-lint.py" "${args[@]}"; then
          status=0
        else
          status=$?
        fi
        if [ "$INPUT_REPORT_ONLY" = "true" ] && [ "$status" -ne 0 ]; then
          echo "::notice::comment-lint found violations; report-only is set, not failing the build"
          exit 0
        fi
        exit "$status"
